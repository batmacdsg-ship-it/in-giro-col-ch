<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IN GIRO COL CH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&amp;family=Figtree:wght@400;600;700&amp;display=swap">
<style>
:root{--bg:#2f4bdc;--onbg:#fff;--card:#f7f5ff;--fg:#101a52;--mut:#4b568f;--acc:#ffd23f;--accink:#101a52;--pink:#ff7aa8;--bd:#101a52;--sh:#101a52;--field:#e6e4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1340;--onbg:#f3f1ff;--card:#18226b;--fg:#f3f1ff;--mut:#b6bcf0;--bd:#8f9bff;--sh:#050a26;--field:#0c1340}}
:root[data-theme="dark"]{--bg:#0c1340;--onbg:#f3f1ff;--card:#18226b;--fg:#f3f1ff;--mut:#b6bcf0;--bd:#8f9bff;--sh:#050a26;--field:#0c1340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--onbg);font:16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
h1,h2,.who{font-family:'Unbounded','Arial Black',system-ui,sans-serif}
h1{margin:12px 0 0;font-size:38px;line-height:1.02;font-weight:800;letter-spacing:-.5px}
.tag{margin:10px 0 22px;font-weight:600;opacity:.9}
h2{margin:0 0 10px;font-size:17px;font-weight:800;line-height:1.25}
.mut{color:var(--mut);margin:2px 0 12px}
.card{background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:14px;padding:16px;margin:18px 0;box-shadow:4px 4px 0 var(--sh)}
.pick{background:var(--acc);color:var(--accink);border-color:#101a52}
.pick .mut{color:var(--accink)}
.pick button{background:var(--accink);color:var(--acc)}
.ticket h2{border-top:2px dashed var(--bd);padding-top:14px}
.hist{margin:26px 0 8px}.hist h2{color:var(--onbg)}
.hist li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.25);list-style:none}.hist ul{padding:0}
.hist .ghost{color:var(--onbg);border-color:var(--onbg)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:11px;border:2px solid var(--bd);border-radius:10px;background:var(--field);color:var(--fg);font:inherit}
button,.wa{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:13px;border:2px solid var(--bd);border-radius:12px;background:var(--acc);color:var(--accink);font:700 16px 'Figtree',system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--sh)}
button:active,.wa:active{transform:translate(3px,3px);box-shadow:none}
.wa{background:#25d366;color:#08210f;margin-top:10px}
.ghost{background:transparent;color:var(--fg);box-shadow:none;font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible,.wa:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.who{display:inline-block;font-size:20px;font-weight:800;background:var(--acc);color:var(--accink);padding:2px 12px;border-radius:8px;margin-top:4px}
.pick .who{background:var(--accink);color:var(--acc)}
summary{font-weight:700;cursor:pointer}
ul{margin:0}
.warn{font-size:13px;background:var(--card);color:var(--mut);border:2px dashed var(--bd);border-radius:10px;padding:8px}
.stk{position:relative;height:190px;margin:0 0 6px}
.stk img{position:absolute;height:auto;transform-origin:50% 100%;animation:hop 2.4s ease-in-out infinite;filter:drop-shadow(2px 3px 0 rgba(5,10,38,.45));pointer-events:none}
@keyframes hop{0%,100%{transform:translateY(0) rotate(var(--r)) scale(1.03,.97)}50%{transform:translateY(-15px) rotate(calc(var(--r)*-.6)) scale(.98,1.02)}}
@media(prefers-reduced-motion:reduce){.stk img{animation:none;transform:rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script id="state" type="application/json">{"people":[{"name":"Piebo","phone":"393489888537"},{"name":"Cannone","phone":"393409949206"},{"name":"Peppino","phone":"393492812789"},{"name":"Gionny","phone":"393335631638"},{"name":"Patata","phone":"393405226381"},{"name":"Sarde","phone":"393403593591"},{"name":"Luzzo","phone":"393483732190"}],"history":[]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const S=JSON.parse(document.getElementById('state').textContent);
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const label=k=>{const [y,m]=k.split('-');return MESI[m-1]+' '+y};
let art=null;
const START='2026-11';
const addM=(m,n)=>{let [y,x]=m.split('-').map(Number);x+=n-1;y+=Math.floor(x/12);x=((x%12)+12)%12+1;return y+'-'+String(x).padStart(2,'0')};
function target(){let m=START;while(S.history.some(h=>h.m===m))m=addM(m,1);return m}
function drawCard(){const e=eligible(),T=target();
  if(T>addM(key(),2))return `<div class="card"><h2>Prossima estrazione</h2><p class="mut" style="margin:0">L'uscita di ${label(T)} si potrà estrarre da ${label(addM(T,-2))}.</p></div>`;
  return `<div class="card pick"><h2>Chi tocca a ${label(T)}?</h2><p class="mut">Ancora in gara: ${e.length} su ${S.people.length}</p><button class="big" onclick="draw()">🎲 Estrai</button></div>`}

function cycle(){let c=0;S.history.forEach(h=>c=Math.max(c,h.cycle));
  return S.history.filter(h=>h.cycle===c&&h.act).length>=S.people.length?c+1:c}
function eligible(){const c=cycle(),u=S.history.filter(h=>h.cycle===c).map(h=>h.p);
  return S.people.map((_,i)=>i).filter(i=>!u.includes(i))}

function buildDoc(){const c=document.documentElement.cloneNode(true);
  c.querySelector('#root').innerHTML='';
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html>\n'+c.outerHTML}
async function commit(snap){
  if(art){try{await art.publish(buildDoc());return}
  catch(e){if(e&&e.code==='conflict')return;if(snap){const o=JSON.parse(snap);S.people=o.people;S.history=o.history}alert('Non riesco a salvare: serve l\'accesso in modifica alla pagina.')}}
  render()}

let drawing=false;
function draw(){
  if(drawing)return;drawing=true;
  const e=eligible(),T=target(),b=document.querySelector('.big');
  const p=e[Math.floor(Math.random()*e.length)];
  const seq=[];for(let k=0;k<14;k++)seq.push(e[Math.floor(Math.random()*e.length)]);seq.push(p);
  let i=0;
  const step=()=>{b.textContent='🎲 '+S.people[seq[i]].name;
    if(++i<seq.length)setTimeout(step,70+i*i*1.6);
    else{b.textContent='🎉 Tocca a '+S.people[p].name+'!';
      setTimeout(()=>{const snap=JSON.stringify(S);S.history.push({m:T,p,cycle:cycle(),act:null});drawing=false;commit(snap)},1200)}};
  step()}
function redraw(){const snap=JSON.stringify(S);S.history=S.history.filter(h=>h.act);commit(snap)}
function save(){const v=id=>$(id).value.trim();
  const a={a:v('fa'),d:v('fd'),t:v('ft'),l:v('fl'),c:v('fc')};
  if(Object.values(a).some(x=>!x)){alert('Compila tutti i campi.');return}
  const snap=JSON.stringify(S);S.history.find(h=>!h.act).act=a;commit(snap)}
function saveP(){const snap=JSON.stringify(S);S.people.forEach((p,i)=>{p.name=$('pn'+i).value.trim()||p.name;p.phone=$('pp'+i).value.replace(/\D/g,'');p.email=$('pe'+i).value.trim()});commit(snap)}

const mapsUrl=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.l);
const pad=n=>String(n).padStart(2,'0');
const gcs=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
function gcalUrl(h,noAdd){const a=h.act,s=new Date(a.d+'T'+a.t),e=new Date(s.getTime()+72e5);
  const g=S.people.filter((p,i)=>i!==h.p&&p.email).map(p=>p.email).join(',');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(a.a+' – '+S.people[h.p].name)+'&dates='+gcs(s)+'/'+gcs(e)+'&ctz=Europe/Rome&location='+encodeURIComponent(a.l)+'&details='+encodeURIComponent('Costo preventivato: '+a.c+' €\nMappa: '+mapsUrl(a))+(g&&!noAdd?'&add='+encodeURIComponent(g):'')}
let dl=null;
async function xl(){
  if(!window.XLSX||!dl){alert('Export Excel non disponibile qui.');return}
  const rows=S.history.filter(x=>x.act).map(x=>({'Mese':label(x.m),'Scelta da':S.people[x.p].name,'Attività':x.act.a,'Data':x.act.d,'Orario':x.act.t,'Luogo':x.act.l,'Costo preventivato (€)':Number(x.act.c),'Google Maps':mapsUrl(x.act)}));
  if(!rows.length){alert('Nessuna uscita da esportare.');return}
  const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:16},{wch:16},{wch:24},{wch:12},{wch:8},{wch:30},{wch:14},{wch:44}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Uscite');
  try{await dl.save({filename:'in-giro-col-ch.xlsx',data:XLSX.write(wb,{bookType:'xlsx',type:'array'})})}
  catch(e){if(!e||e.code!=='declined')alert('Non sono riuscito a salvare il file.')}}
const fd=a=>new Date(a.d+'T12:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
const msg=h=>{const a=h.act;return `🎉 ${label(h.m)}: tocca a ${S.people[h.p].name}!\n\n📌 ${a.a}\n🗓 ${fd(a)}\n⏰ ${a.t}\n📍 ${a.l}\n💶 Costo preventivato: ${a.c} €\n🗺 ${mapsUrl(a)}\n📆 Aggiungi al calendario: ${gcalUrl(h,1)}`};

function render(){
  const k=key(),pend=S.history.find(h=>!h.act),last=S.history.filter(h=>h.act).slice(-1)[0],cur=pend||last;
  let h='';
  if(!art)h+=`<p class="warn">Anteprima: le modifiche non vengono salvate finché la pagina non è aperta con accesso in modifica.</p>`;
  if(!cur){
    h+=drawCard();
  }else if(!cur.act){
    h+=`<div class="card"><p class="mut" style="margin:0">Estratto per ${label(cur.m)}</p><div class="who">${esc(S.people[cur.p].name)}</div>
    <p class="mut">Scegli l'attività per il gruppo:</p>
    <label>Attività</label><input id="fa" placeholder="Es. Cena, bowling, gita…">
    <div class="row"><div><label>Data</label><input id="fd" type="date"></div><div><label>Orario</label><input id="ft" type="time"></div></div>
    <label>Luogo</label><input id="fl" placeholder="Indirizzo o nome del posto">
    <label>Costo preventivato (€ a persona)</label><input id="fc" type="number" min="0" step="0.5" inputmode="decimal">
    <button onclick="save()">Salva e prepara gli avvisi</button>
    <button class="ghost" onclick="redraw()">Rifai l'estrazione</button></div>`;
  }else{
    const a=cur.act,m=encodeURIComponent(msg(cur));
    h+=`<div class="card ticket"><p class="mut" style="margin:0">${label(cur.m)} · scelta da</p><div class="who">${esc(S.people[cur.p].name)}</div>
    <h2 style="margin-top:10px">${esc(a.a)}</h2>
    <div>🗓 ${esc(fd(a))} · ⏰ ${esc(a.t)}</div><div>📍 ${esc(a.l)}</div><div>💶 ${esc(a.c)} € preventivati</div><a class="wa" style="background:var(--pink)" target="_blank" rel="noopener" href="${mapsUrl(a)}">🗺 Apri su Google Maps</a><a class="wa" style="background:var(--pink)" target="_blank" rel="noopener" href="${gcalUrl(cur)}">📆 Aggiungi a Google Calendar</a></div>
    <div class="card"><h2>Avvisa gli altri su WhatsApp</h2>
    <a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${m}">📣 Manda nel gruppo</a>`;
    S.people.forEach((p,i)=>{if(i!==cur.p)h+=`<a class="wa" style="background:transparent;color:var(--fg);border:1px solid var(--bd)" target="_blank" rel="noopener" href="https://wa.me/${p.phone}?text=${m}">Avvisa ${esc(p.name)}</a>`});
    h+=`</div>`+drawCard();
  }
  const done=S.history.filter(x=>x.act).slice().reverse();
  if(done.length)h+=`<div class="hist"><h2>Storico</h2><ul>${done.map(x=>`<li><b>${label(x.m)}</b> – ${esc(S.people[x.p].name)}: ${esc(x.act.a)}</li>`).join('')}</ul>${dl?'<button class="ghost" onclick="xl()">📊 Scarica Excel di tutte le uscite</button>':''}</div>`;
  h+=`<details class="card"><summary>Partecipanti, WhatsApp ed email</summary>
  <p class="mut">Numero con prefisso, senza +. Es. 393331234567</p>`;
  S.people.forEach((p,i)=>h+=`<div class="row" style="margin-top:10px"><input id="pn${i}" value="${esc(p.name)}"><input id="pp${i}" value="${esc(p.phone)}" inputmode="tel" placeholder="39…"></div><input id="pe${i}" type="email" value="${esc(p.email||'')}" placeholder="email (per Google Calendar)" style="margin-top:4px">`);
  h+=`<button onclick="saveP()">Salva partecipanti</button></details>`;
  $('root').innerHTML=h;
}
render();
if(window.claude&&claude.use)claude.use('downloads').then(d=>{if(d){dl=d;render()}});
if(window.claude&&claude.use)claude.use('artifact').then(a=>{if(a){art=a;render()}});
</script>
</body></html>
